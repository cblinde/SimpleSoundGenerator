name: Build, screenshot & release

# Every push to main validates the sources, builds the portable zip and renders
# docs/screenshot.png offscreen. A GitHub release tagged v<APP_VERSION> is only
# created when APP_VERSION changed in the pushed commit or that tag does not
# exist yet, so ordinary pushes never overwrite existing release assets.
# Pull requests only run the checks and keep the artifacts.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check sources & build zip
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      create: ${{ steps.release.outputs.create }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The release decision compares APP_VERSION with the previous commit.
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile every module
        run: |
          python -m py_compile \
            code/app.py code/audio_engine.py code/model_manager.py \
            code/paths.py code/flash_attn_setup.py \
            _dev/build_delivery.py _dev/screenshot.py

      - name: Validate registry and launcher
        run: |
          python -m json.tool config/models.json > /dev/null
          bash -n run.sh

      - name: Build portable delivery zip
        run: python _dev/build_delivery.py

      - name: Decide whether a release is needed
        id: release
        run: |
          set -eu
          version="$(python - <<'EOF'
          import pathlib, re
          text = pathlib.Path("code/app.py").read_text(encoding="utf-8")
          match = re.search(r'^APP_VERSION\s*=\s*"([^"]+)"', text, re.MULTILINE)
          assert match, "APP_VERSION not found"
          print(match.group(1))
          EOF
          )"
          previous=""
          if git rev-parse --verify -q 'HEAD^' >/dev/null 2>&1; then
            previous="$(git show 'HEAD^:code/app.py' 2>/dev/null \
              | sed -nE 's/^APP_VERSION = "([^"]+)".*/\1/p' | head -n 1)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # A release is due when the version was bumped in this commit, or when
          # the tag does not exist yet (first release of that version).
          if [ "$version" = "$previous" ] && \
             git ls-remote --tags --exit-code origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "APP_VERSION ${version} unchanged and tag v${version} exists - no release."
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release needed: APP_VERSION ${version}, previous ${previous:-none}."
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage the zip flat in dist/
        run: |
          set -eu
          mkdir -p dist
          cp delivery/SimpleSoundGenerator-v*.zip \
            "dist/SimpleSoundGenerator-v${{ steps.release.outputs.version }}.zip"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: delivery
          path: dist/
          if-no-files-found: error

  screenshot:
    name: Render window screenshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libpulse0 libxrandr2 libxrender1 \
            libsndfile1 fonts-dejavu-core

      - name: Install the Qt binding used by the app
        run: |
          python -m pip install --disable-pip-version-check \
            "PySide6==6.12.0" "numpy==2.4.6" "soundfile==0.14.0"

      - name: Render the window offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python _dev/screenshot.py docs/screenshot.png

      - name: Stage the screenshot flat in dist/
        run: |
          mkdir -p dist
          cp docs/screenshot.png dist/screenshot.png
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.check.outputs.create == 'true'
    needs: [check, screenshot]
    runs-on: ubuntu-latest
    steps:
      # Both artifacts were uploaded from a dist/ folder, so they land flat in
      # dist/ - no directory nesting and no search step needed.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show the downloaded assets
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: Simple Sound Generator v${{ needs.check.outputs.version }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Portable build of Simple Sound Generator — unzip the archive, then
            start `run.bat` (Windows) or `./run.sh` (macOS/Linux). The launcher
            builds its own Python environment and downloads model weights on
            first use, so no installer or admin rights are needed.

            The screenshot above is rendered from the current source by CI.
          files: |
            dist/SimpleSoundGenerator-v${{ needs.check.outputs.version }}.zip
            dist/screenshot.png

      - name: Verify both assets are attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${{ needs.check.outputs.version }}"
          gh release view "v${version}" --json assets --jq '.assets[].name' | tee /tmp/assets.txt
          grep -qx "SimpleSoundGenerator-v${version}.zip" /tmp/assets.txt
          grep -qx "screenshot.png" /tmp/assets.txt
          echo "Release v${version} carries the zip and the screenshot."
